name: GSX Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push nginx
      run: |
        docker build -t alexxx245/nginx-gsx:${{ github.sha }} ./config/week2/docker-nginx
        docker push alexxx245/nginx-gsx:${{ github.sha }}

    - name: Build and push python
      run: |
        docker build -t alexxx245/python-gsx:${{ github.sha }} ./config/week2/docker-python
        docker push alexxx245/python-gsx:${{ github.sha }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend=false
      working-directory: ./config/week4

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./config/week4




