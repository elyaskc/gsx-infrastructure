services:
  nginx:
    build: ./docker-nginx
    ports:
      - "8080:8080"
    depends_on:
      - python

  python:
    build: ./docker-python
    ports:
      - "5001:5001"
    depends_on:
      - db

  db:
    image: postgres:13
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  db_data:
